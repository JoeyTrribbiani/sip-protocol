name: CI

# python-ci-standard 档位 A（分发库）: L1 依赖安装 / L2 静态检查 / L3 类型检查
# L4 测试+覆盖率 / L5 安全审计；L6 性能为可选未启用（纯加密核心以 pytest 覆盖）

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python Lint + Type + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # L1 依赖安装
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install project
      run: pip install -e .

    # L2 静态检查
    - name: Run Black
      run: black src/sip_protocol/ --check

    - name: Run Pylint
      run: pylint src/sip_protocol/

    # L3 类型检查
    - name: Run MyPy
      run: mypy src/sip_protocol/

    # L4 测试 + 覆盖率
    - name: Run tests
      run: pytest tests/ --cov=src/sip_protocol --cov-report=xml --cov-report=term

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./python/coverage.xml

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # L5 安全审计（pip 由 runner 管理，CVE-2026-3219 为 pip 自身误报）
    - name: Install Python dependencies
      working-directory: ./python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Python audit
      working-directory: ./python
      run: pip-audit --ignore-vuln CVE-2026-3219
