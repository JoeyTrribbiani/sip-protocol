name: CI

# python-ci-standard 档位 A（分发库）: L1 依赖安装（uv --frozen 精确复现）
# L2 静态检查 / L3 类型检查 / L4 测试+覆盖率 / L5 安全审计
# 档位 A 打包验证（python-project-standard #7/#8）：wheel 文件清单核验
# L6 性能为可选未启用（纯加密核心以 pytest 覆盖）
# release job 仅 tag 触发（refs/tags/v*），needs 既有两 job：全绿后自动
# 发 GitHub Release，notes 取 CHANGELOG 对应 tag 定版节；tag 格式不符/
# 缺定版节/空节即红（防呆在 CI 层，不发空 notes）；同名 Release 已存在则跳过

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # 新增 tag 触发面；分支 push / PR 触发条件与原先一致
  pull_request:
    branches: [ main ]

env:
  UV_VERSION: "0.9"

jobs:
  python-test:
    name: Python Lint + Type + Test + Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    # L1 依赖安装：uv + 锁文件精确复现（本地与 CI 同命令）
    - name: Sync dependencies (frozen)
      run: uv sync --frozen

    # L2 静态检查（black 格式 + pylint 10.00 基线，工具链冻结见 AGENTS.md）
    - name: Run Black
      run: uv run black src/sip_protocol/ --check

    - name: Run Pylint
      run: uv run pylint src/sip_protocol/

    # L3 类型检查
    - name: Run MyPy
      run: uv run mypy src/sip_protocol/

    # L4 测试 + 覆盖率（cov 参数由 pyproject [tool.pytest.ini_options] addopts 统一）
    - name: Run tests
      run: uv run pytest tests/

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml

    # 档位 A 打包验证：build 后打开 whl 核验文件清单（防 address.txt 型漏文件）
    - name: Build & verify wheel contents
      run: |
        uv build
        uv run python - <<'EOF'
        import zipfile, glob
        whl = glob.glob("dist/*.whl")[0]
        names = zipfile.ZipFile(whl).namelist()
        py = [n for n in names if n.endswith(".py")]
        assert "sip_protocol/__init__.py" in names, "缺包根 __init__"
        assert "sip_protocol/filetransfer/packer.py" in names, "缺 filetransfer/packer"
        assert "sip_protocol/filetransfer/unpacker.py" in names, "缺 filetransfer/unpacker"
        assert "sip_protocol/transport/sip_mcp_server.py" in names, "缺 MCP server"
        assert "sip_protocol/protocol/rekey.py" in names, "缺 rekey"
        assert "sip_protocol/crypto/sm2.py" in names, "缺国密 sm2"
        assert "sip_protocol/crypto/sm3.py" in names, "缺国密 sm3"
        assert "sip_protocol/crypto/sm4_gcm.py" in names, "缺国密 sm4_gcm"
        assert "sip_protocol/crypto/suite.py" in names, "缺套件分派 suite"
        assert len(py) == 28, f"py 文件数目异常: {len(py)}（预期 28）"
        assert not any(n.startswith("tests/") for n in names), "wheel 混入测试"
        print(f"wheel 清单核验通过: {len(names)} 个文件, {len(py)} 个 .py")
        EOF

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Sync dependencies (frozen)
      run: uv sync --frozen

    # L5 安全审计（runner 管理的包不阻塞 CI：CVE-2026-3219 为 pip 自身误报；
    # PYSEC-2026-3447 为 runner 预装 setuptools 79.0.1 < 修复版 83.0.0，非项目依赖）
    - name: Python audit
      run: uv run pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3447

  # 发版自动化：tag push 触发整条 CI，本 job 殿后——全绿即 Release 就位。
  release:
    name: Release (tag only, auto after green)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-test, security-audit]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 校验 tag 格式（vX.Y.Z）
      run: |
        echo "tag: ${GITHUB_REF_NAME}"
        grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"${GITHUB_REF_NAME}" \
          || { echo "::error::tag 格式应为 vX.Y.Z，实际 ${GITHUB_REF_NAME}"; exit 1; }

    # 提取仅用 stdlib（re/os/sys），系统 python3 即可，不 uv sync
    - name: 提取 CHANGELOG 定版节为 notes（缺节/空节即红，不发空 notes）
      run: |
        python3 - <<'EOF'
        import os
        import re
        import sys

        tag = os.environ["GITHUB_REF_NAME"]  # 如 v2.2.0
        ver = tag[1:]  # CHANGELOG 节头无 v 前缀
        text = open("CHANGELOG.md", encoding="utf-8").read()
        # 精确匹配节头 ## [X.Y.Z] 整行——[Unreleased]/其他版本/子串不会误命中
        m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*$", text, re.M)
        if m is None:
            sys.exit(f"CHANGELOG.md 无 [{ver}] 定版节——先定版再打 tag")
        rest = text[m.end():]
        # 节尾边界：下一节头，或 Keep a Changelog 尾部 [x.y.z]: url 链接引用定义
        nxt = re.search(r"^## \[|^\[.+\]:", rest, re.M)
        body = rest[: nxt.start()] if nxt else rest
        # 剥节尾 --- 分隔线（本仓节间有分隔线）与首尾空行；节头行不入 notes
        body = re.sub(r"\n-{3,}\s*$", "", body).strip()
        if not body:
            sys.exit(f"CHANGELOG.md [{ver}] 定版节为空——不发空 notes")
        with open("release-notes.md", "w", encoding="utf-8") as f:
            f.write(body + "\n")
        print(f"notes 提取成功：[{ver}] 定版节 {body.count(chr(10)) + 1} 行")
        EOF

    - name: 创建 GitHub Release（非 draft 非 prerelease；已存在则跳过）
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
          echo "Release ${GITHUB_REF_NAME} 已存在（可能手工补发过）——跳过创建"
          exit 0
        fi
        gh release create "${GITHUB_REF_NAME}" --notes-file release-notes.md
